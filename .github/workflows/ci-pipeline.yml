name: Forex ML Bot - CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC - retrain models
    - cron: "0 6 * * *"

env:
  PYTHON_VERSION: "3.11"
  CONFIG_PATH: "config/system_config.yaml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 pytest pytest-cov

      - name: Lint with flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format check with black
        run: black --check src/ || true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml || true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  agent-a-data:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Agent A - Data Ingestion
        run: |
          cd src
          python -c "
from core.pipeline_orchestrator import PipelineOrchestrator
orch = PipelineOrchestrator(kaggle_mode=False)
result = orch.run_single_agent('agent_a')
print(f'Agent A: success={result.success}')
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-a-features
          path: output/agent_a/features/
          retention-days: 7

  agent-b-training:
    runs-on: ubuntu-latest
    needs: agent-a-data
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Agent A artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-a-features
          path: output/agent_a/features/

      - name: Run Agent B - Model Training
        run: |
          cd src
          python -c "
from core.pipeline_orchestrator import PipelineOrchestrator
orch = PipelineOrchestrator(kaggle_mode=False)
result = orch.run_single_agent('agent_b')
print(f'Agent B: success={result.success}')
          "

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-models
          path: output/agent_b/
          retention-days: 30

  agent-e-backtest:
    runs-on: ubuntu-latest
    needs: agent-b-training
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Agent A artifacts
        uses: actions/download-artifact@v4
        with:
          name: agent-a-features
          path: output/agent_a/features/

      - name: Download Agent B models
        uses: actions/download-artifact@v4
        with:
          name: agent-b-models
          path: output/agent_b/

      - name: Run Agent E - Backtesting
        run: |
          cd src
          python -c "
from core.pipeline_orchestrator import PipelineOrchestrator
orch = PipelineOrchestrator(kaggle_mode=False)
result = orch.run_single_agent('agent_e')
print(f'Agent E: success={result.success}')
          "

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: output/agent_e/
          retention-days: 30

  deploy-models:
    runs-on: ubuntu-latest
    needs: [agent-b-training, agent-e-backtest]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Deploy to cloud storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          pip install awscli
          aws s3 sync artifacts/ s3://${S3_BUCKET}/forex-bot/models/${{ github.run_id }}/

      - name: Create deployment manifest
        run: |
          echo "{\"run_id\": \"${{ github.run_id }}\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > deployment-manifest.json
          aws s3 cp deployment-manifest.json s3://${S3_BUCKET}/forex-bot/models/latest/

  notify:
    runs-on: ubuntu-latest
    needs: [lint-and-test, agent-a-data, agent-b-training, agent-e-backtest]
    if: always()
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Forex ML Bot Pipeline: ${{ needs.lint-and-test.result == 'success' && needs.agent-a-data.result == 'success' && needs.agent-b-training.result == 'success' && needs.agent-e-backtest.result == 'success' && 'SUCCESS' || 'FAILED' }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}