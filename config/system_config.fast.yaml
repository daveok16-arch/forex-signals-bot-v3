# AI/ML Forex Signals Bot — Master Configuration
# Environment variables override: ${VAR_NAME}

system:
  name: "ForexMLBot"
  version: "1.0.0"
  mode: "paper"           # paper | live | backtest
  timezone: "UTC"
  log_level: "INFO"
  debug: false
  max_workers: 4

pairs:
  primary:
    - symbol: "EURUSD"
      pip_value: 0.0001
      spread_avg: 0.00008
      min_lot: 0.01
      max_lot: 100.0
    - symbol: "GBPUSD"
      pip_value: 0.0001
      spread_avg: 0.00012
      min_lot: 0.01
      max_lot: 100.0
    - symbol: "USDJPY"
      pip_value: 0.01
      spread_avg: 0.008
      min_lot: 0.01
      max_lot: 100.0
    - symbol: "AUDUSD"
      pip_value: 0.0001
      spread_avg: 0.00010
      min_lot: 0.01
      max_lot: 100.0
    - symbol: "USDCAD"
      pip_value: 0.0001
      spread_avg: 0.00012
      min_lot: 0.01
      max_lot: 100.0
    - symbol: "USDCHF"
      pip_value: 0.0001
      spread_avg: 0.00010
      min_lot: 0.01
      max_lot: 100.0
    - symbol: "NZDUSD"
      pip_value: 0.0001
      spread_avg: 0.00014
      min_lot: 0.01
      max_lot: 100.0
    - symbol: "XAUUSD"
      pip_value: 0.01
      spread_avg: 0.15
      min_lot: 0.01
      max_lot: 50.0

timeframes:
  - name: "M5"
    minutes: 5
    description: "5-minute candles"
  - name: "M15"
    minutes: 15
    description: "15-minute candles"
  - name: "H1"
    minutes: 60
    description: "1-hour candles"
  - name: "H4"
    minutes: 240
    description: "4-hour candles"
  - name: "D1"
    minutes: 1440
    description: "Daily candles"

agents:
  agent_a:
    name: "DataIngestionEngine"
    enabled: true
    data_sources:
      - "oanda"
      - "kaggle"
      - "truefx"
    kaggle_datasets:
      - "yakashri/export-15-fx-currency-pairs-1m"
      - "imetomi/eur-usd-forex-pair-historical-data"
    lookback_days: 252
    feature_count: 200
    batch_size: 10000
    data_quality_threshold: 0.95
    technical_indicators:
      overlap:
        - "sma"
        - "ema"
        - "wma"
        - "dema"
        - "tema"
        - "trima"
        - "kama"
        - "mama"
        - "t3"
        - "bbands"
        - "sar"
        - "midpoint"
      momentum:
        - "rsi"
        - "macd"
        - "stoch"
        - "cci"
        - "adx"
        - "momentum"
        - "roc"
        - "willr"
        - "ultosc"
        - "aroon"
        - "mom"
        - "ppo"
      volume:
        - "obv"
        - "ad"
        - "adosc"
        - "cmf"
      volatility:
        - "atr"
        - "natr"
        - "trange"
    statistical_features:
      - "returns"
      - "log_returns"
      - "realized_volatility"
      - "skewness"
      - "kurtosis"
      - "z_score"
      - "percentile_rank"
    feature_selection:
      method: "mrmr"           # mrmr | boruta_shap | mutual_info
      n_features: 80
      min_importance: 0.01

  agent_b:
    name: "ModelTrainingEngine"
    enabled: true
    kaggle_mode: true
    gpu_enabled: true
    mixed_precision: true
    models:
      lstm:
        enabled: true
        units: [64, 128, 256]
        dropout: [0.1, 0.2, 0.3]
        learning_rate: [0.001, 0.0001]
        batch_size: [64, 128]
        epochs: 100
        sequence_length: 60
        early_stopping_patience: 10
      xgboost:
        enabled: true
        n_estimators: [100, 500, 1000]
        max_depth: [3, 5, 7, 9]
        learning_rate: [0.01, 0.05, 0.1]
        subsample: [0.6, 0.8, 1.0]
        colsample_bytree: [0.6, 0.8, 1.0]
        min_child_weight: [1, 3, 5]
        gamma: [0, 0.1, 0.2]
      lightgbm:
        enabled: true
        n_estimators: [100, 500, 1000]
        num_leaves: [31, 63, 127]
        max_depth: [5, 7, 10, -1]
        learning_rate: [0.01, 0.05, 0.1]
        feature_fraction: [0.8, 0.9, 1.0]
        bagging_fraction: [0.8, 0.9, 1.0]
        bagging_freq: [5]
      catboost:
        enabled: true
        iterations: [500, 1000]
        depth: [4, 6, 8, 10]
        learning_rate: [0.01, 0.05, 0.1]
        l2_leaf_reg: [1, 3, 5, 7]
      tabnet:
        enabled: true
        n_d: [8, 16, 32]
        n_a: [8, 16, 32]
        n_steps: [3, 5, 7]
        gamma: [1.0, 1.5, 2.0]
        lambda_sparse: [0.001, 0.01, 0.1]
        learning_rate: [0.01, 0.02]
      transformer:
        enabled: true
        d_model: [64, 128]
        nhead: [4, 8]
        num_layers: [2, 4]
        dim_feedforward: [256, 512]
        dropout: [0.1, 0.2]
        learning_rate: [0.0001, 0.00001]
    optimization:
      framework: "optuna"      # optuna | ray_tune
      n_trials: 5
      timeout_hours: 4
      pruner: "hyperband"      # hyperband | median | none
      sampler: "tpe"           # tpe | cmaes | random
      cv_folds: 5
      purge_gap: 10
      embargo_pct: 0.01
    training:
      test_size: 0.2
      validation_size: 0.15
      random_seed: 42
      class_weighting: true
      ensemble_method: "stacking"  # stacking | blending | voting

  agent_c:
    name: "SignalGenerationEngine"
    enabled: true
    ensemble_method: "dynamic_weighted"
    min_confidence: 0.65
    max_confidence: 0.95
    signal_decay_minutes: 60
    prediction_horizon: "H1"     # M5 | M15 | H1 | H4 | D1
    signal_types:
      - "directional"           # Buy/Sell
      - "volatility"            # Volatility forecast
      - "regime"                # Market regime classification
    uncertainty_quantification:
      method: "conformal"        # conformal | mcdropout | bootstrap
      confidence_level: 0.90
    signal_filters:
      min_models_agree: 3
      correlation_threshold: 0.7
      consecutive_signal_min: 2

  agent_d:
    name: "RiskManagementEngine"
    enabled: true
    max_risk_per_trade: 0.02
    max_total_risk: 0.06
    max_correlated_risk: 0.04
    kelly_fraction: 0.5
    var_confidence: 0.95
    cvar_confidence: 0.95
    max_drawdown_pct: 0.10
    daily_loss_limit_pct: 0.03
    weekly_loss_limit_pct: 0.05
    position_sizing:
      method: "kelly_half"       # kelly_half | fixed_fraction | volatility_targeting
      volatility_lookback: 20
      target_annual_volatility: 0.15
    stop_loss:
      method: "atr_based"        # atr_based | fixed | volatility | support_resistance
      atr_multiplier: 2.0
      max_sl_pips: 50
      min_sl_pips: 10
    take_profit:
      method: "risk_reward"      # risk_reward | atr_based | trailing
      risk_reward_ratio: 2.0
      trailing_activation: 1.0
    dynamic_adjustment:
      regime_based: true
      win_streak_adjustment: true
      loss_streak_adjustment: true
      consecutive_losses_reduce: 3
      consecutive_wins_increase: 5

  agent_e:
    name: "BacktestingEngine"
    enabled: true
    initial_capital: 100000
    commission_per_lot: 3.5
    spread_markup: 1.0
    slippage_model: "fixed"      # fixed | variable | none
    slippage_pips: 0.5
    risk_free_rate: 0.02
    benchmark: "buy_and_hold"
    walk_forward:
      enabled: true
      train_size: 0.7
      test_size: 0.3
      min_train_size: 252
      step_size: 63
    monte_carlo:
      enabled: true
      n_simulations: 10000
      randomize_returns: true
      randomize_trades: true
    metrics:
      - "total_return"
      - "annualized_return"
      - "sharpe_ratio"
      - "sortino_ratio"
      - "calmar_ratio"
      - "max_drawdown"
      - "max_drawdown_duration"
      - "win_rate"
      - "profit_factor"
      - "avg_trade"
      - "avg_win"
      - "avg_loss"
      - "expectancy"
      - "omega_ratio"
      - "tail_ratio"
      - "gain_to_pain"
      - "deflated_sharpe"
      - "probability_of_overfitting"
    reporting:
      generate_equity_curve: true
      generate_drawdown_chart: true
      generate_monthly_returns: true
      generate_trade_distribution: true
      generate_regime_performance: true
      save_format: ["html", "json"]

  agent_f:
    name: "TradeExecutionEngine"
    enabled: true
    execution_mode: "paper"      # paper | live
    broker: "oanda"
    environment: "practice"      # practice | live
    api_timeout: 30
    max_retries: 3
    retry_delay: 1.0
    order_types:
      - "market"
      - "limit"
      - "stop"
      - "oco"
    execution_style: "single"    # single | twap | vwap
    twap_slices: 4
    twap_interval_seconds: 30
    partial_fill_handling: "wait"  # wait | immediate | cancel
    position_management:
      max_open_positions: 10
      max_positions_per_pair: 2
      hedge_mode: false
      close_on_opposite: true

  agent_g:
    name: "MonitoringCloudSyncEngine"
    enabled: true
    logging:
      format: "structured"       # structured | simple
      correlation_id: true
      log_file: "logs/bot.log"
      max_file_size_mb: 100
      backup_count: 10
      log_to_cloud: true
    monitoring:
      health_check_interval: 60
      metrics_export: "prometheus"
      metrics_port: 9090
      alert_on_error_count: 3
    cloud_backup:
      provider: "aws"            # aws | gcp | azure
      aws_region: "us-east-1"
      s3_bucket: "${S3_BUCKET}"
      s3_prefix: "forex-bot/"
      backup_interval_hours: 6
      backup_on_event: true
      compression: "gzip"
      encryption: true
    github:
      repo: "${GITHUB_REPO}"
      branch: "main"
      auto_commit: true
      commit_message_template: "[BOT] {timestamp} - {event}"
      push_models: true
      push_notebooks: true
      push_results: true
    alerting:
      channels:
        - type: "slack"
          webhook_url: "${SLACK_WEBHOOK}"
          level: "warning"
        - type: "email"
          smtp_host: "${SMTP_HOST}"
          smtp_port: 587
          from: "${SMTP_FROM}"
          to: "${SMTP_TO}"
          level: "critical"
      alert_events:
        - "system_error"
        - "drawdown_threshold"
        - "model_degradation"
        - "backup_failure"
        - "broker_disconnect"
